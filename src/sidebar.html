<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser Mirror</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="sidebar-page">
    <div class="toolbar">
      <img class="toolbar-logo" src="icons/icon-32.png" alt="Browser Mirror" />
      <h1 class="app-title" id="appTitle">Browser Mirror</h1>
      <div class="toolbar-actions">
        <select id="uiLangSelect" title="Interface language"></select>
        <button id="resetBtn" class="btn btn-red btn-sm toolbar-group-gap" title="Reset all tabs">Reset all</button>
        <button id="themeToggle" class="theme-toggle toolbar-group-gap" title="Toggle theme">&#9728;&#65039;</button>
      </div>
    </div>

    <div class="controls">
      <button id="pageBtn" class="btn btn-yellow">Mirror page</button>
      <button id="videoBtn" class="btn btn-green">Mirror video</button>
      <p class="hint-text" id="videoHint">Start playing the video, then mirror.</p>
    </div>

    <div class="status-area" id="statusArea">
      <p class="welcome-text" id="welcomeText">Click a button above to mirror the current tab or its main video area.</p>
    </div>
  </div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
